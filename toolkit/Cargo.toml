[package]
name = "toolkit"
version = "0.1.0"
edition = "2021"
description = "STM32F407 development toolkit: analyze, lint, flow-analysis, generate-docs, rag-search"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.27.1"
tree-sitter-c = "0.24.2"
ureq = { version = "2", features = ["json"] }

[profile.release]
lto = true
