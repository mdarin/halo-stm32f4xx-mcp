[package]
name = "toolkit"
version = "0.1.0"
edition = "2021"
description = "STM32F407 development toolkit: analyze, lint, flow-analysis, generate-docs, rag-search"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.27.1"
tree-sitter-c = "0.24.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
sha2 = "0.10"

[dev-dependencies]
wiremock = "0.6"

[profile.release]
lto = true
